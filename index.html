<!doctype html>

<html>

<head>
  <title>IIIF Viewer</title>
  <meta name="viewport"
    content="initial-scale=1.0, width=device-width, user-scalable=yes, minimum-scale=1.0, maximum-scale=2.0">
  <link rel="stylesheet" type="text/css" href="viewer_style.css">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@annotorious/openseadragon@latest/dist/annotorious-openseadragon.css">
  <link href="https://fonts.googleapis.com/css?family=Barlow+Condensed:100,200,400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;700&display=swap" rel="stylesheet">
  <script src="javascript/openseadragon/openseadragon.min.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/@annotorious/openseadragon@latest/dist/annotorious-openseadragon.js"></script>
  <script src="javascript/openseadragon/openseadragon-scalebar.js"></script>
  <script src="javascript/jquery-3.5.1.min.js"></script>
  <script src="javascript/openseadragon-bookmark-url.js"></script>
</head>

<body>
  <div id="imageviewer" style="position:absolute; width:100%!important; height:100%!important;">
    <div class="interface-area-top">
      <div class="toolbar-top">

        <a id="prev-button" href="#previous-page">
          <div id="Prev" class="NavButton"></div>
        </a>
        <span id='currentpage'>1 / 1</span>
        <a id="next-button" href="#next-page">
          <div id="Next" class="NavButton"></div>
        </a>

      </div>
    </div>

    <div id="ToolbarVertical">
      <a id="rotate-left" href="#rotate-left">
        <div id="RotateLeft" class="NavButton"></div>
      </a>
      <a id="rotate-right" href="#rotate-right">
        <div id="RotateRight" class="NavButton"></div>
      </a>
    </div>

    <div id="copy-url" class="round-button share-button" title="Copy link to view" onclick="logPosition()">
      <div id="share-label" class="label-popup">Link copied</div>
    </div>
    <div id="annotation-tooltip" class="annotation-tooltip"></div>

    <a id="download" ref="downloadButton" target="_self" href="">
      <div class="download-button deactivated" title="Download image"></div>
    </a>
  </div>


  <!--  These are the regular controls -->
  <div class="interface-area-bottom">
    <div class="toolbar-bottom">

      <a id="home" href="#home">
        <div id="Home" class="NavButton"></div>
      </a>
      <a id="zoom-in" href="#zoom-in">
        <div id="ZoomIn" class="NavButton"></div>
      </a>
      <a id="zoom-out" href="#zoom-out">
        <div id="ZoomOut" class="NavButton"></div>
      </a>
      <a id="annotate-toggle" href="#annotate">
        <div id="AnnotateToggle" class="NavButton"></div>
      </a>
      <button id="save-annotations" class="toolbar-text-button" title="Save annotations"
        aria-label="Save annotations"></button>
    </div>
  </div>
  </div>
  <div id="load-popup" class="load-popup visible">
    <div class="load-popup-card">
      <button id="close-load-popup" class="load-popup-close" type="button" aria-label="Close">x</button>
      <div class="load-popup-title">Load annotations?</div>
      <button id="load-annotations" class="load-popup-action" type="button">Load</button>
    </div>
  </div>
  <input id="annotations-file-input" type="file" accept="application/json" hidden>

  <script type="text/javascript">
    let urlToCopy = '';
    let currentRotation = 0;
    let annotationModeEnabled = false;
    let annotationsFileHandle = null;
    let suppressAutosave = false;
    let hoverTooltipText = '';
    const annotationsFilename = 'annotations.json';
    //uncomment this url to enabled the download button
    //const imageDownloadUrl = '';

    function normalizeViewerPath(pathname) {
      return pathname.replace(/\/index\.html$/, '/');
    }

    function logPosition() {
      $('#share-label').addClass('popup-animation').delay(3000).queue(function () {
        $('#share-label').removeClass('popup-animation').dequeue();
      });

      if (!viewer || !viewer.viewport) {
        console.error('Viewer is not ready yet');
        return;
      }

      const zoom = viewer.viewport.getZoom();
      const center = viewer.viewport.getCenter();
      const rotation = typeof viewer.viewport.getRotation === 'function' ? viewer.viewport.getRotation() : 0;
      const page = typeof viewer.currentPage === 'function' ? viewer.currentPage() : 0;
      const hasSequence = Array.isArray(viewer.tileSources) && viewer.tileSources.length > 1;

      const url = new URL(window.location.href);
      url.pathname = normalizeViewerPath(url.pathname);
      const hashParams = new URLSearchParams(url.hash.replace(/^#/, ''));
      hashParams.set('zoom', zoom);
      hashParams.set('x', center.x);
      hashParams.set('y', center.y);
      hashParams.set('rotation', rotation);
      if (hasSequence) {
        hashParams.set('page', page);
      } else {
        hashParams.delete('page');
      }

      url.hash = hashParams.toString();
      urlToCopy = url.toString();

      navigator.clipboard.writeText(urlToCopy)
        .then(() => console.log(`${urlToCopy} copied to clipboard`))
        .catch(err => console.error('Could not copy URL:', err));
    }

    function enableDownloadButton() {
      var downloadAnchor = $('#download');
      var downloadButton = $('#download .download-button');
      downloadAnchor.off('click');

      if (imageDownloadUrl) {
        downloadButton.removeClass('deactivated');
        downloadAnchor.attr('href', '#');
        downloadAnchor.removeAttr('target');
        downloadAnchor.removeAttr('rel');
        downloadAnchor.removeAttr('download');
        downloadAnchor.on('click', async function (event) {
          event.preventDefault();
          try {
            const response = await fetch(imageDownloadUrl);
            if (!response.ok) throw new Error('Download failed');
            const blob = await response.blob();
            const objectUrl = URL.createObjectURL(blob);
            const filename = imageDownloadUrl.split('/').pop() || 'image';
            const tempLink = document.createElement('a');
            tempLink.href = objectUrl;
            tempLink.download = filename;
            document.body.appendChild(tempLink);
            tempLink.click();
            tempLink.remove();
            URL.revokeObjectURL(objectUrl);
          } catch (err) {
            window.open(imageDownloadUrl, '_blank', 'noopener');
          }
        });
        return;
      }

      downloadButton.addClass('deactivated');
      downloadAnchor.removeAttr('download');
      downloadAnchor.removeAttr('href');
    }

    function withAnnotationText(annotation, text) {
      const value = (text || '').trim();

      return {
        ...annotation,
        bodies: value ? [{
          purpose: 'commenting',
          value: value
        }] : []
      };
    }

    function getAnnotationText(annotation) {
      const body = (annotation.bodies || []).find(function (item) {
        return item && typeof item.value === 'string' && item.value.trim();
      });

      return body ? body.value.trim() : '';
    }

    function showAnnotationTooltip(text) {
      const tooltip = document.getElementById('annotation-tooltip');
      hoverTooltipText = text;
      tooltip.textContent = text;
      tooltip.classList.add('visible');
    }

    function hideAnnotationTooltip() {
      hoverTooltipText = '';
      document.getElementById('annotation-tooltip').classList.remove('visible');
    }

    function moveAnnotationTooltip(event) {
      if (!hoverTooltipText) {
        return;
      }

      const tooltip = document.getElementById('annotation-tooltip');
      tooltip.style.left = (event.clientX + 12) + 'px';
      tooltip.style.top = (event.clientY + 12) + 'px';
    }

    function getAnnotationsJson() {
      return JSON.stringify(anno.getAnnotations(), null, 2);
    }

    async function writeAnnotationsFile(handle) {
      const writable = await handle.createWritable();
      await writable.write(getAnnotationsJson());
      await writable.close();
    }

    function downloadAnnotationsFile() {
      const blob = new Blob([getAnnotationsJson()], { type: 'application/json' });
      const objectUrl = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = objectUrl;
      link.download = annotationsFilename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(objectUrl);
    }

    async function saveAnnotationsToFile() {
      try {
        if (!window.showSaveFilePicker) {
          downloadAnnotationsFile();
          return;
        }

        if (!annotationsFileHandle) {
          annotationsFileHandle = await window.showSaveFilePicker({
            suggestedName: annotationsFilename,
            types: [{
              description: 'JSON Files',
              accept: { 'application/json': ['.json'] }
            }]
          });
        }

        await writeAnnotationsFile(annotationsFileHandle);
      } catch (error) {
        if (error.name !== 'AbortError') {
          console.error('Could not save annotations:', error);
        }
      }
    }

    async function persistAnnotations() {
      if (!annotationsFileHandle || suppressAutosave) {
        return;
      }

      try {
        await writeAnnotationsFile(annotationsFileHandle);
      } catch (error) {
        console.error('Could not update annotations file:', error);
      }
    }

    function replaceAnnotations(annotations) {
      suppressAutosave = true;
      anno.setAnnotations(annotations, true);
      suppressAutosave = false;
    }

    async function loadAnnotationsFromText(text) {
      try {
        const annotations = JSON.parse(text);
        replaceAnnotations(Array.isArray(annotations) ? annotations : []);
      } catch (error) {
        console.error('Could not load annotations:', error);
        alert('Could not load annotations.json');
      }
    }

    async function loadAnnotationsFromFile() {
      try {
        if (window.showOpenFilePicker) {
          const [fileHandle] = await window.showOpenFilePicker({
            multiple: false,
            types: [{
              description: 'JSON Files',
              accept: { 'application/json': ['.json'] }
            }]
          });

          if (!fileHandle) {
            return;
          }

          annotationsFileHandle = fileHandle;
          const file = await fileHandle.getFile();
          await loadAnnotationsFromText(await file.text());
          return;
        }

        document.getElementById('annotations-file-input').click();
      } catch (error) {
        if (error.name !== 'AbortError') {
          console.error('Could not open annotations file:', error);
        }
      }
    }

    function updateAnnotationButton() {
      document.getElementById('AnnotateToggle').classList.toggle('active', annotationModeEnabled);
    }

    function setAnnotationMode(enabled) {
      annotationModeEnabled = enabled;
      anno.setDrawingEnabled(enabled);
      updateAnnotationButton();
    }

    function toggleAnnotationMode(event) {
      event.preventDefault();
      setAnnotationMode(!annotationModeEnabled);
    }

    function closeLoadPopup() {
      document.getElementById('load-popup').classList.remove('visible');
    }

    var viewer = OpenSeadragon({
      id: "imageviewer",
      immediateRender: false,
      visibilityRatio: 0.8,
      minZoomImageRatio: 0.8,
      maxZoomPixelRatio: 1,
      homeFillsViewer: false,
      showZoomControl: true,
      showHomeControl: true,
      showFullPageControl: true,
      showNavigator: true,
      navigatorPosition: "TOP_RIGHT",
      navigatorAutoFade: true,
      preserveViewport: true,
      fullPageButton: "full-page",
      zoomInButton: "zoom-in",
      zoomOutButton: "zoom-out",
      nextButton: "next-button",
      previousButton: "prev-button",
      showRotationControl: true,
      rotateLeftButton: "rotate-left",
      rotateRightButton: "rotate-right",
      gestureSettingsTouch: {
        pinchRotate: true
      },
      homeButton: "home",
      sequenceMode: true,
      prefixUrl: "javascript/openseadragon/images/",
      tileSources: [
        "https://img.dh.gu.se/saintsophia/static/inscriptions/iiif/32e92b30-b018-4538-b3b6-dac6f67fdedf.tif/info.json",
      ],
    });
    viewer.addHandler("page", function (data) {
      document.getElementById("currentpage").innerHTML = (data.page + 1) + " / 1";
    });
    viewer.scalebar({
      type: OpenSeadragon.ScalebarType.MICROSCOPY,
      minWidth: "50px",
      pixelsPerMeter: 10,
      location: OpenSeadragon.ScalebarLocation.BOTTOM_RIGHT,
      color: "rgb(255, 255, 255)",
      fontColor: "rgb(255, 255, 255)",
      fontSize: "18px",
      xOffset: 20,
      yOffset: 20,
      stayInsideImage: false,
    });
    viewer.addHandler('bookmark-url-change', function (event) {
      const eventUrl = new URL(event.url);
      eventUrl.pathname = normalizeViewerPath(eventUrl.pathname);
      urlToCopy = eventUrl.toString();
    });
    viewer.bookmarkUrl({ updateUrl: false });

    const anno = AnnotoriousOSD.createOSDAnnotator(viewer, {
      drawingEnabled: false,
      drawingMode: 'drag'
    });

    anno.on('createAnnotation', function (annotation) {
      setAnnotationMode(false);
      const text = window.prompt('Annotation text:', '');
      if (text === null) {
        anno.removeAnnotation(annotation.id);
        return;
      }
      anno.updateAnnotation(withAnnotationText(annotation, text));
      persistAnnotations();
    });
    anno.on('mouseEnterAnnotation', function (annotation) {
      const text = getAnnotationText(annotation);
      if (text) {
        showAnnotationTooltip(text);
      }
    });
    anno.on('mouseLeaveAnnotation', hideAnnotationTooltip);
    anno.on('updateAnnotation', persistAnnotations);
    anno.on('deleteAnnotation', persistAnnotations);

    document.getElementById('annotate-toggle').addEventListener('click', toggleAnnotationMode);
    document.getElementById('save-annotations').addEventListener('click', saveAnnotationsToFile);
    document.getElementById('load-annotations').addEventListener('click', function () {
      closeLoadPopup();
      loadAnnotationsFromFile();
    });
    document.getElementById('close-load-popup').addEventListener('click', closeLoadPopup);
    document.addEventListener('mousemove', moveAnnotationTooltip);
    document.getElementById('annotations-file-input').addEventListener('change', async function (event) {
      const file = event.target.files[0];
      if (file) {
        await loadAnnotationsFromText(await file.text());
      }
      event.target.value = '';
    });
    updateAnnotationButton();

    window.anno = anno;
    enableDownloadButton();
  </script>

</body>

</html>
